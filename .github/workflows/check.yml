# 每次推送、每个合并请求：Linux 和 Windows 各跑一遍 npm run check（类型检查、函数复杂度、完整测试、覆盖、发布检查、构建）。
# 推到主分支或 ci- 分支时再在 Linux 上跑一遍界面流程（npm run test:ui）。测试全是虚构数据、不调真实模型，不需要任何密钥。
name: 体检

on:
  push:
  pull_request:

# 同一分支连着推几次，只跑最新那次
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: 体检（${{ matrix.os }}）
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          cache: npm
      # 发布检查会真的起一次启动入口，Linux 上启动时要查中文字体
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends fonts-noto-cjk
      - run: npm ci
      - run: npm run check

  ui:
    name: 界面流程（Linux）
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/ci-'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # 机器上装好的 Chrome；流程里要量中文排版宽度，补中文字体
      CHROME_PATH: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          cache: npm
      # 临时目录指到这台机器的临时目录（作业级的 env 里用不了 runner，所以在步骤里设）
      - run: echo "TMPDIR=$RUNNER_TEMP" >> "$GITHUB_ENV"
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends fonts-noto-cjk
      - run: npm ci
      - run: npm run test:ui
      # 没过时把截图、每组日志和 trace 留下来（run.mjs 写在系统临时目录的 erp-ui-check-*）
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ui-check
          path: ${{ runner.temp }}/erp-ui-check-*/
          retention-days: 7
