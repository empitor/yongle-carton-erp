org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
org.gradle.caching=true
# 仓库放在中文名的目录里，AGP 默认拒绝非 ASCII 路径；实测本工程在中文路径下检查、测试、打包都正常，所以关掉这道路径检查。
android.overridePathCheck=true
# 外壳全是 Java、运行时不许有第三方库：AGP 9 自带的 Kotlin 支持默认把 kotlin-stdlib 加进运行时依赖、打进安装包，关掉这一条
# （app/build.gradle.kts 的 checkNoRuntimeLibraries 守着运行时依赖为空）
kotlin.stdlib.default.dependency=false

# 外壳自己的版本：每发一次新安装包 appVersionCode 加 1（应用内更新按它比新旧），appVersionName 给人看
appVersionCode=1
appVersionName=0.1.0

# 应用内更新的版本清单地址（HTTPS）。留空 = 不检查更新；临时换别的地址在命令行用 -P 加同名参数
releaseUpdateUrl=https://erp.nbyongle.cn/app-update/android/manifest.json
# 测试版的版本清单：scripts/update-test.ps1 打包时生成、-Serve 在本机 8787 端口提供，经 adb reverse 访问
testUpdateUrl=http://127.0.0.1:8787/update/manifest.json

# 测试版（debug 构建）打开的网址：本目录 test-site/ 的虚构测试页。
# 电脑上用 JDK 自带的 jwebserver 起服务，再用 adb reverse 把手机的 127.0.0.1:8787 接到电脑上。
# 换别的测试网址：命令行加 -PerpTestUrl=…，不要改正式版网址（写在 app/build.gradle.kts）。
erpTestUrl=http://127.0.0.1:8787/
